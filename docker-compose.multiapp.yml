# SyncScript - Multi-App VPS Override
# Usage: docker compose -f docker-compose.yml -f docker-compose.multiapp.yml up -d
#
# This file is used for shared VPS deployment with central nginx proxy.
# Key differences from base: no resource limits, shared nginx proxy, no per-app nginx.
#
# NOTE: Host port collisions are avoided via unique port values in .env.
# The nginx proxy reaches apps via Docker network (container ports), not host ports.

services:
  # ==========================================================================
  # Backend (Django + Daphne ASGI)
  # ==========================================================================
  backend:
    image: ghcr.io/haseebadnan0/syncscript-backend:${IMAGE_TAG:-latest}
    build: null
    container_name: syncscript_backend
    expose:
      - "8000"
    volumes:
      - backend_static:/app/staticfiles
      - backend_media:/app/media
      - backend_logs:/app/logs
    environment:
      - DEBUG=False
      - SECRET_KEY=${SECRET_KEY}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/0
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-syncscript.haseebadnan.com}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-https://syncscript.haseebadnan.com}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS:-https://syncscript.haseebadnan.com}
      - SITE_URL=${SITE_URL:-https://syncscript.haseebadnan.com}
      # Email
      - EMAIL_HOST=${EMAIL_HOST:-smtp.hostinger.com}
      - EMAIL_PORT=${EMAIL_PORT:-465}
      - EMAIL_USE_SSL=${EMAIL_USE_SSL:-True}
      - EMAIL_HOST_USER=${EMAIL_HOST_USER:-}
      - EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD:-}
      - DEFAULT_FROM_EMAIL=${DEFAULT_FROM_EMAIL:-}
      # OAuth
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID:-}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET:-}
      # Storage (Cloudflare R2)
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_STORAGE_BUCKET_NAME=${AWS_STORAGE_BUCKET_NAME:-}
      - AWS_S3_ENDPOINT_URL=${AWS_S3_ENDPOINT_URL:-}
      - AWS_S3_REGION_NAME=${AWS_S3_REGION_NAME:-auto}
      # AI (OpenRouter)
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-deepseek/deepseek-v3.2}
      - AI_DAILY_LIMIT=${AI_DAILY_LIMIT:-20}
      # Pusher
      - PUSHER_APP_ID=${PUSHER_APP_ID:-}
      - PUSHER_KEY=${PUSHER_KEY:-}
      - PUSHER_SECRET=${PUSHER_SECRET:-}
      - PUSHER_CLUSTER=${PUSHER_CLUSTER:-}
    networks:
      - syncscript_network
      - proxy_network
    restart: unless-stopped

  # ==========================================================================
  # Frontend (Next.js)
  # ==========================================================================
  frontend:
    image: ghcr.io/haseebadnan0/syncscript-frontend:${IMAGE_TAG:-latest}
    build: null
    container_name: syncscript_frontend
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
    networks:
      - syncscript_network
      - proxy_network
    restart: unless-stopped

  # ==========================================================================
  # PostgreSQL Database
  # ==========================================================================
  db:
    container_name: syncscript_db
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    restart: unless-stopped

  # ==========================================================================
  # Redis
  # ==========================================================================
  redis:
    container_name: syncscript_redis
    restart: unless-stopped

  # ==========================================================================
  # Celery Worker
  # ==========================================================================
  celery:
    image: ghcr.io/haseebadnan0/syncscript-backend:${IMAGE_TAG:-latest}
    build: null
    container_name: syncscript_celery
    command: celery -A config worker -l info
    volumes:
      - backend_media:/app/media
      - backend_logs:/app/logs
    environment:
      - DEBUG=False
      - SECRET_KEY=${SECRET_KEY}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/0
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-deepseek/deepseek-v3.2}
    networks:
      - syncscript_network
    restart: unless-stopped

  # ==========================================================================
  # Disable per-app nginx (using central proxy)
  # ==========================================================================
  nginx:
    profiles:
      - disabled

# ==========================================================================
# External network for nginx proxy
# ==========================================================================
networks:
  proxy_network:
    external: true
    name: proxy_network
