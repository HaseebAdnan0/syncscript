# SyncScript - CI/CD Pipeline (Multi-App VPS)
#
# Triggered by commit message prefixes:
#   [deploy]        - Deploy immediately WITHOUT running tests
#   [test-deploy]   - Run tests first, deploy only if tests pass
#
# Required GitHub Secrets:
#   - VPS_HOST: Server IP address
#   - VPS_USER: SSH user (deploy)
#   - VPS_SSH_KEY: Private SSH key
#   - NEXT_PUBLIC_API_URL: Backend API URL
#   - NEXT_PUBLIC_WS_URL: WebSocket URL

name: Deploy

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ${{ github.repository }}-backend
  FRONTEND_IMAGE: ${{ github.repository }}-frontend

jobs:
  # ===========================================================================
  # Job 1: Check deployment type
  # ===========================================================================
  check-deploy:
    name: Check Deploy Type
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.check.outputs.should_deploy }}
      should_test: ${{ steps.check.outputs.should_test }}
      deploy_type: ${{ steps.check.outputs.deploy_type }}
    steps:
      - name: Check commit message for deploy prefix
        id: check
        run: |
          COMMIT_MSG="${{ github.event.head_commit.message }}"

          if [[ "$COMMIT_MSG" == \[deploy\]* ]]; then
            echo "should_deploy=true" >> $GITHUB_OUTPUT
            echo "should_test=false" >> $GITHUB_OUTPUT
            echo "deploy_type=fast" >> $GITHUB_OUTPUT
          elif [[ "$COMMIT_MSG" == \[test-deploy\]* ]]; then
            echo "should_deploy=true" >> $GITHUB_OUTPUT
            echo "should_test=true" >> $GITHUB_OUTPUT
            echo "deploy_type=tested" >> $GITHUB_OUTPUT
          else
            echo "should_deploy=false" >> $GITHUB_OUTPUT
            echo "should_test=false" >> $GITHUB_OUTPUT
            echo "deploy_type=none" >> $GITHUB_OUTPUT
          fi

  # ===========================================================================
  # Job 2: Run Tests (only for [test-deploy])
  # ===========================================================================
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: check-deploy
    if: needs.check-deploy.outputs.should_test == 'true'

    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_DB: syncscript_test
          POSTGRES_USER: syncscript
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U syncscript -d syncscript_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev poppler-utils

      - name: Install Python dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-django

      - name: Run migrations
        working-directory: backend
        env:
          DB_NAME: syncscript_test
          DB_USER: syncscript
          DB_PASSWORD: test_password
          DB_HOST: localhost
          DB_PORT: 5432
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test-secret-key-for-ci
          DEBUG: 'True'
          DJANGO_SETTINGS_MODULE: config.settings
        run: python manage.py migrate --noinput

      - name: Run tests
        working-directory: backend
        env:
          DB_NAME: syncscript_test
          DB_USER: syncscript
          DB_PASSWORD: test_password
          DB_HOST: localhost
          DB_PORT: 5432
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test-secret-key-for-ci
          DEBUG: 'True'
          DJANGO_SETTINGS_MODULE: config.settings
        run: pytest apps/ -v --tb=short --maxfail=5

  # ===========================================================================
  # Job 3: Build and Push Backend Image
  # ===========================================================================
  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest
    needs: [check-deploy, test]
    if: |
      always() &&
      needs.check-deploy.outputs.should_deploy == 'true' &&
      (needs.check-deploy.outputs.should_test == 'false' || needs.test.result == 'success')

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (backend)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=,format=short

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

  # ===========================================================================
  # Job 4: Build and Push Frontend Image
  # ===========================================================================
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    needs: [check-deploy, test]
    if: |
      always() &&
      needs.check-deploy.outputs.should_deploy == 'true' &&
      (needs.check-deploy.outputs.should_test == 'false' || needs.test.result == 'success')

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (frontend)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=,format=short

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_WS_URL=${{ secrets.NEXT_PUBLIC_WS_URL }}
            NEXT_PUBLIC_PUSHER_KEY=${{ secrets.NEXT_PUBLIC_PUSHER_KEY }}
            NEXT_PUBLIC_PUSHER_CLUSTER=${{ secrets.NEXT_PUBLIC_PUSHER_CLUSTER }}

  # ===========================================================================
  # Job 5: Deploy to VPS
  # ===========================================================================
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: [check-deploy, build-backend, build-frontend]
    if: |
      always() &&
      needs.check-deploy.outputs.should_deploy == 'true' &&
      needs.build-backend.result == 'success' &&
      needs.build-frontend.result == 'success'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            set -e

            echo "=== SyncScript Deploy ==="
            cd /opt/apps/syncscript

            # Pull latest code (for compose files, configs)
            git pull origin main

            # Login to GHCR
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Pull new images
            docker compose -f docker-compose.yml -f docker-compose.multiapp.yml pull backend frontend

            # Restart services (db, redis stay running)
            docker compose -f docker-compose.yml -f docker-compose.multiapp.yml up -d backend frontend celery

            # Wait for health
            sleep 15
            for i in {1..15}; do
              if docker exec syncscript_backend curl -sf http://localhost:8000/api/v1/health/ > /dev/null 2>&1; then
                echo "Backend health check passed"
                break
              fi
              echo "Waiting for backend... ($i/15)"
              sleep 3
            done

            for i in {1..10}; do
              if docker exec syncscript_frontend wget -q --spider http://localhost:3000/ 2>&1; then
                echo "Frontend health check passed"
                break
              fi
              echo "Waiting for frontend... ($i/10)"
              sleep 2
            done

            # Reload nginx proxy to pick up any config changes
            docker exec nginx_proxy nginx -s reload 2>/dev/null || true

            # Clean up old images
            docker image prune -f

            echo "=== Deploy Complete ==="
            docker ps --format "table {{.Names}}\t{{.Status}}" | grep -E "syncscript|nginx"
