# SyncScript - Docker Compose Development Configuration
# Usage: docker compose up -d
#
# Services:
#   - backend: Django + Daphne ASGI server (port 8000)
#   - frontend: Next.js application (port 3000)
#   - db: PostgreSQL 17 (port 5432)
#   - redis: Redis cache & message broker (port 6379)
#   - celery: Celery worker for async tasks
#   - nginx: Nginx reverse proxy (port 80)

services:
  # ==========================================================================
  # Backend (Django + Daphne ASGI)
  # ==========================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: syncscript_backend
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    volumes:
      # Mount source code for hot reload in development
      - ./backend:/app
      # Named volumes for persistent data
      - backend_static:/app/staticfiles
      - backend_media:/app/media
      - backend_logs:/app/logs
    environment:
      - DEBUG=True
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-in-production}
      - DB_NAME=${DB_NAME:-syncscript}
      - DB_USER=${DB_USER:-syncscript}
      - DB_PASSWORD=${DB_PASSWORD:-syncscript_dev_password}
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/0
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - ALLOWED_HOSTS=localhost,127.0.0.1,backend
      - CORS_ALLOWED_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
      - SITE_URL=http://localhost:3000
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - syncscript_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ==========================================================================
  # Frontend (Next.js)
  # ==========================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
        - NEXT_PUBLIC_WS_URL=ws://localhost:8000/ws
    container_name: syncscript_frontend
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
    depends_on:
      - backend
    networks:
      - syncscript_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ==========================================================================
  # PostgreSQL Database
  # ==========================================================================
  db:
    image: postgres:17-bookworm
    container_name: syncscript_db
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5436}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${DB_NAME:-syncscript}
      - POSTGRES_USER=${DB_USER:-syncscript}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-syncscript_dev_password}
    networks:
      - syncscript_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-syncscript} -d ${DB_NAME:-syncscript}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ==========================================================================
  # Redis (Cache + Celery Broker + Channels Layer)
  # ==========================================================================
  redis:
    image: redis:7-alpine
    container_name: syncscript_redis
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - syncscript_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ==========================================================================
  # Celery Worker
  # ==========================================================================
  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: syncscript_celery
    command: celery -A config worker -l info
    volumes:
      - ./backend:/app
      - backend_media:/app/media
      - backend_logs:/app/logs
    environment:
      - DEBUG=True
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-in-production}
      - DB_NAME=${DB_NAME:-syncscript}
      - DB_USER=${DB_USER:-syncscript}
      - DB_PASSWORD=${DB_PASSWORD:-syncscript_dev_password}
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/0
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - syncscript_network
    restart: unless-stopped

  # ==========================================================================
  # Nginx Reverse Proxy (Development)
  # ==========================================================================
  nginx:
    image: nginx:1.27-alpine
    container_name: syncscript_nginx
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
    volumes:
      - ./deploy/nginx/dev.conf:/etc/nginx/nginx.conf:ro
      - backend_static:/var/www/static:ro
      - backend_media:/var/www/media:ro
    depends_on:
      - backend
      - frontend
    networks:
      - syncscript_network

# ==========================================================================
# Named Volumes
# ==========================================================================
volumes:
  postgres_data:
    name: syncscript_postgres_data
  redis_data:
    name: syncscript_redis_data
  backend_static:
    name: syncscript_static
  backend_media:
    name: syncscript_media
  backend_logs:
    name: syncscript_logs

# ==========================================================================
# Networks
# ==========================================================================
networks:
  syncscript_network:
    name: syncscript_network
    driver: bridge
